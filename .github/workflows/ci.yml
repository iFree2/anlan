name: synthetic-engineering-checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17-trixie
        env:
          POSTGRES_USER: anlan_test
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: anlan_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U anlan_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ANLAN_DATABASE_URL: postgresql://anlan_test:synthetic-ci-only@127.0.0.1:5432/anlan_test
      ANLAN_TEST_DATABASE_URL: postgresql://anlan_test:synthetic-ci-only@127.0.0.1:5432/anlan_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.7.5'
          python-version: '3.13'
      - run: uv sync --locked
      - run: uv run --no-sync python scripts/ci.py --output .runtime/ci/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-check-results
          path: .runtime/ci/
