      <text x="576" y="1118" font-size="13" font-weight="bold" fill="#1C4E8C">安防设备</text>
      <text x="576" y="1140" font-size="12" fill="#333333">门禁 / 疏散门</text>
      <text x="576" y="1158" font-size="12" fill="#333333">应急广播</text>
      <text x="576" y="1176" font-size="12" fill="#333333">周界报警</text>
    </g>
    <g>
