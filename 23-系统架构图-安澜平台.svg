      <text x="476" y="1018" font-size="12" fill="#666666">MQTT / Modbus（气体 · 烟感 · 电气）→ Kafka 告警流</text>
    </g>
    <g>
      <rect x="860" y="980" width="470" height="44" rx="4" fill="#FFFFFF" stroke="#37BC9B" stroke-width="1.5"/>
