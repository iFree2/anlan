    <rect x="40" y="940" width="1330" height="30" rx="6" fill="#37BC9B"/>
    <text x="56" y="960" font-size="16" font-weight="bold" fill="#FFFFFF">接入 / 传输层｜设备协议接入（视频 · 物联 · 边缘，弱网容错）</text>

    <g>
