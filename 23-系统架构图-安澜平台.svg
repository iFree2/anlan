    <text x="1416" y="132" font-size="13" fill="#333333"><tspan x="1416" dy="0" font-weight="bold">多租户隔离</tspan><tspan x="1416" dy="19">租户-组织-部门-个人四级</tspan><tspan x="1416" dy="24" font-weight="bold">字段级脱敏</tspan><tspan x="1416" dy="19">作业票 / 隐患 / 人员信息</tspan><tspan x="1416" dy="24" font-weight="bold">全量操作审计</tspan><tspan x="1416" dy="19">≥ 1 年 · 可导出（安监）</tspan><tspan x="1416" dy="24" font-weight="bold">引用溯源校验</tspan><tspan x="1416" dy="19">条款 / 预案锚点必可查</tspan><tspan x="1416" dy="24" font-weight="bold">越权访问拦截</tspan><tspan x="1416" dy="19">命中即告警（演练验证）</tspan><tspan x="1416" dy="24" font-weight="bold">数据不出园</tspan><tspan x="1416" dy="19">私有化 + 信创适配</tspan></text>
