    <text x="1416" y="612" font-size="13" fill="#333333"><tspan x="1416" dy="0" font-weight="bold">GPU 集群</tspan><tspan x="1416" dy="19">A800-80G / 昇腾 910B（信创）</tspan><tspan x="1416" dy="24" font-weight="bold">推理与量化</tspan><tspan x="1416" dy="19">vLLM · AWQ INT4 · FP8 KV</tspan><tspan x="1416" dy="24" font-weight="bold">模型分档</tspan><tspan x="1416" dy="19">32B 判级 · 7B 轻 · 1.5B 边缘</tspan><tspan x="1416" dy="24" font-weight="bold">边缘节点</tspan><tspan x="1416" dy="19">4090 · 断网 T0 联动可用</tspan><tspan x="1416" dy="24" font-weight="bold">LLMOps 可观测</tspan><tspan x="1416" dy="19">轨迹回放 · 监控大盘 · 计量</tspan><tspan x="1416" dy="24" font-weight="bold">Harness 发布门禁</tspan><tspan x="1416" dy="19">L0 / L1 / L2 · CI 集成</tspan><tspan x="1416" dy="24" font-weight="bold">容量核算</tspan><tspan x="1416" dy="19">业务量→峰值吞吐→卡数</tspan></text>
